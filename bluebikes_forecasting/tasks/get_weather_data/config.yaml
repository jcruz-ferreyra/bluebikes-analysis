# tasks/get_weather_data/config.yaml

# NCEI API configuration
dataset: "GHCND"  # Global Historical Climatology Network Daily
station: "USW00014739"  # Boston Logan Airport

# Data types to fetch
datatypes:
  - "TMAX"  # Maximum temperature
  - "TMIN"  # Minimum temperature
  - "PRCP"  # Precipitation
  - "SNOW"  # Snowfall
  - "SNWD"  # Snow depth (Accumulation)
  - "AWND"  # Average wind speed

# Date range
start_date: "2018-01-01"  # YYYY-MM-DD format
end_date: "yesterday"  # YYYY-MM-DD format or "yesterday"

# Storage location
output_storage: "local"  # "local" or "drive"