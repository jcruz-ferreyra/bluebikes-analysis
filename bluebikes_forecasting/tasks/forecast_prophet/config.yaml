# tasks/forecast_prophet/config.yaml

# Inference configuration
inference_start_date: "2026-03-01"  # YYYY-MM-DD - start generating forecasts from this date
inference_end_date: "end_of_data"   # YYYY-MM-DD or "end_of_data" - forecast up to this date

# Retraining schedule
retrain_every_days: 7  # Retrain every N days (0 = train once, no retraining)

# Model artifacts
save_models: false  # Set true to save trained Prophet models

# Storage location
output_storage: "local"  # "local" or "drive"